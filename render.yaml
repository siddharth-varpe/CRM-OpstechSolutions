services:
  # ============================================================
  # SERVICE 1: Admin CRM Frontend (Render Static Site)
  # ============================================================
  - type: static
    name: sr-enterprises-admin
    buildCommand: npm install -g pnpm@9.15.4 && pnpm install --frozen-lockfile && pnpm --filter @crm/web build:admin
    staticPublishPath: apps/web/dist/admin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
      ignoredPaths:
        - apps/web/src/modules/technician-portal/**
        - apps/web/src/TechnicianApp.tsx
        - apps/web/src/technician-main.tsx
        - apps/web/technician.html
        - apps/api/**
        - apps/desktop/**
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_MAPS_JAVASCRIPT_API_KEY
        sync: false

  # ============================================================
  # SERVICE 2: Technician Portal Frontend (Render Static Site)
  # ============================================================
  - type: static
    name: sr-enterprises-technician
    buildCommand: npm install -g pnpm@9.15.4 && pnpm install --frozen-lockfile && pnpm --filter @crm/web build:technician
    staticPublishPath: apps/web/dist/technician
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    buildFilter:
      paths:
        - apps/web/src/modules/technician-portal/**
        - apps/web/src/TechnicianApp.tsx
        - apps/web/src/technician-main.tsx
        - apps/web/technician.html
        - apps/web/src/components/**
        - apps/web/src/lib/**
        - apps/web/src/providers/**
        - apps/web/src/styles/**
        - apps/web/public/**
        - apps/web/vite.config.ts
        - apps/web/package.json
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
      ignoredPaths:
        - apps/web/src/modules/dashboard/**
        - apps/web/src/modules/customers/**
        - apps/web/src/modules/sales/**
        - apps/web/src/modules/rentals/**
        - apps/web/src/modules/invoices/**
        - apps/web/src/modules/assets/**
        - apps/web/src/modules/services/**
        - apps/web/src/modules/inventory/**
        - apps/web/src/modules/payments/**
        - apps/web/src/modules/reminders/**
        - apps/web/src/modules/reports/**
        - apps/web/src/modules/settings/**
        - apps/web/src/modules/dues/**
        - apps/web/src/modules/whatsapp/**
        - apps/web/src/AdminApp.tsx
        - apps/web/src/admin-main.tsx
        - apps/api/**
        - apps/desktop/**
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_MAPS_JAVASCRIPT_API_KEY
        sync: false

  # ============================================================
  # SERVICE 3: Shared Backend API (Render Web Service)
  # ============================================================
  - type: web
    name: sr-enterprises-crm-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: export NODE_OPTIONS="--max-old-space-size=1024" && npm install -g pnpm@9.15.4 && pnpm install --frozen-lockfile && pnpm --filter @crm/api build
    startCommand: exec node --max-old-space-size=384 --expose-gc --import tsx apps/api/src/server.ts
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
      ignoredPaths:
        - apps/web/**
        - apps/desktop/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.3
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: NODE_OPTIONS
        value: --max-old-space-size=384 --expose-gc
      - key: COOKIE_SAME_SITE
        value: none
      - key: USE_POSTGRES
        value: "true"
      - key: DB_MAX_CONNECTIONS
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WEB_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: ARCHIVE_DATABASE_URL
        sync: false
      - key: MAPS_JAVASCRIPT_API_KEY
        sync: false
      - key: ROUTES_API_KEY
        sync: false
      - key: MAP_ID
        sync: false
      - key: GOOGLE_MAPS_BROWSER_API_KEY
        sync: false
      - key: GOOGLE_MAPS_SERVER_API_KEY
        sync: false
      - key: GOOGLE_MAPS_MAP_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
